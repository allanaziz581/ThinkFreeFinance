name: verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install reproducible review dependencies
        run: python -m pip install -r requirements-review.txt
      - name: Regression and application security checks
        run: python -m pytest tests -q
      - name: Browser flow unit tests
        run: node --test tests/*.test.cjs
      - name: Repository credential scan
        run: python agents/security_audit.py
      - name: Install security tools
        run: python -m pip install bandit pip-audit
      - name: Static analysis (medium/high severity and confidence)
        run: bandit -r server agents -ll -ii
      - name: Backend dependency vulnerabilities
        run: pip-audit -r server/requirements.txt
