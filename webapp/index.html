<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ThinkFree Finance</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="app">
    <!-- ============ SIDEBAR ============ -->
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-logo">TF</div>
        <div>
          <div class="brand-name">Think<span>Free</span></div>
          <div class="brand-sub">Finance</div>
        </div>
      </div>

      <nav class="nav" id="nav">
        <div class="nav-label">Main</div>
        <div class="nav-item active" data-page="dashboard">
          <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></span><span>Dashboard</span></div>
        <div class="nav-item" data-page="news">
          <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="7" y1="8" x2="13" y2="8"/><line x1="7" y1="12" x2="17" y2="12"/><line x1="7" y1="16" x2="17" y2="16"/></svg></span><span>News</span></div>
        <div class="nav-item" data-page="influence">
          <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="2.4"/><circle cx="5" cy="6" r="1.8"/><circle cx="19" cy="6" r="1.8"/><circle cx="5" cy="18" r="1.8"/><circle cx="19" cy="18" r="1.8"/><path d="M10.2 10.6 6.4 7.2M13.8 10.6l3.8-3.4M10.2 13.4 6.4 16.8M13.8 13.4l3.8 3.4"/></svg></span><span>InfluenceWeb</span></div>
        <div class="nav-item" data-page="intelligence">
          <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19V5M4 19h16M8 16v-5M12 16V8M16 16v-3M20 16V6"/></svg></span><span>Intelligence</span></div>
        <div class="nav-item" data-page="states">
          <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6l6-3 6 3 6-3v15l-6 3-6-3-6 3V6Z"/><path d="M9 3v15M15 6v15"/></svg></span><span>State Rankings</span></div>
        <div class="nav-item" data-page="political">
          <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 21h18"/><path d="M4 10h16"/><path d="M5 10v8M19 10v8M9 10v8M15 10v8"/><path d="M12 3 4 7h16Z"/></svg></span><span>Political Watch</span></div>
        <div class="nav-item" data-page="portfolio">
          <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></span><span>My Portfolio</span></div>
        <div class="nav-label">Intelligence</div>
        <div class="nav-item" data-page="markets">
          <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><line x1="4" y1="20" x2="4" y2="12"/><line x1="10" y1="20" x2="10" y2="6"/><line x1="16" y1="20" x2="16" y2="9"/><line x1="20" y1="20" x2="20" y2="4"/></svg></span><span>Markets</span></div>
        <div class="nav-item" data-page="reasoning">
          <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="9" r="6"/><path d="M9 21h6M10 18h4"/><path d="M12 3v6M9 6h6"/></svg></span><span>Reasoning</span></div>
        <div class="nav-item" data-page="history">
          <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span><span>History</span></div>
        <div class="nav-item" data-page="settings">
          <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1l2-1.6-2-3.4-2.4 1a7 7 0 0 0-1.7-1l-.4-2.5h-4l-.4 2.5a7 7 0 0 0-1.7 1l-2.4-1-2 3.4 2 1.6a7 7 0 0 0 0 2l-2 1.6 2 3.4 2.4-1a7 7 0 0 0 1.7 1l.4 2.5h4l.4-2.5a7 7 0 0 0 1.7-1l2.4 1 2-3.4-2-1.6a7 7 0 0 0 .1-1Z"/></svg></span><span>Settings</span></div>
      </nav>

      <div class="sidebar-foot">
        <div class="toggle-row">
          <span>Dark Mode</span>
          <div class="switch" id="darkToggle"></div>
        </div>
        <div class="user-chip">
          <div class="user-avatar" id="userAvatar">A</div>
          <div>
            <div class="user-name" id="userName">Allan</div>
            <div class="user-plan" id="userPlan">Free Plan</div>
          </div>
        </div>
      </div>
    </aside>

    <!-- ============ MAIN ============ -->
    <div class="main">
      <div class="ticker" id="ticker"></div>

      <div class="topbar">
        <div class="greeting">
          <span class="streak" title="3-day streak">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3c1 3 4 4 4 7a4 4 0 1 1-8 0c0-1 .5-2 1-2.5C9 9 12 7 12 3Z"/></svg>
          </span>
          <div>
            <h1 id="greet">Good evening, Allan</h1>
            <div class="sub" id="greetSub">Your daily financial intelligence briefing</div>
          </div>
        </div>
        <div class="search-wrap">
          <label class="search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="16" height="16"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg>
            <input type="text" id="searchInput" placeholder="Search politicians, bills, tickers, events…" autocomplete="off" />
          </label>
          <div class="search-results" id="searchResults"></div>
        </div>
      </div>

      <div class="viewport">
        <section class="page active" id="page-dashboard"></section>
        <section class="page" id="page-influence"></section>
        <section class="page" id="page-intelligence"></section>
        <section class="page" id="page-states"></section>
        <section class="page" id="page-news"></section>
        <section class="page" id="page-political"></section>
        <section class="page" id="page-portfolio"></section>
        <section class="page" id="page-markets"></section>
        <section class="page" id="page-reasoning"></section>
        <section class="page" id="page-history"></section>
        <section class="page" id="page-settings"></section>
      </div>
    </div>
  </div>

  <!-- modal overlay (politician profile / full trades) -->
  <div class="modal-overlay" id="modal">
    <div class="modal" id="modalBox">
      <button class="modal-close" id="modalClose" aria-label="Close">&times;</button>
      <div class="modal-content" id="modalContent"></div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/influence_data.js"></script>
  <script src="js/nonprofit_data.js"></script>
  <script src="js/fec_data.js"></script>
  <script src="js/sec_data.js"></script>
  <script src="js/secbulk_data.js"></script>
  <script src="js/usaspending_data.js"></script>
  <script src="js/states_data.js"></script>
  <script src="js/legiscan_data.js"></script>
  <script src="js/openstates_data.js"></script>
  <script src="js/prices_data.js"></script>
  <script src="js/sp500_data.js"></script>
  <script src="js/quant_data.js"></script>
  <script src="js/scores.js"></script>
  <script src="js/genimpact.js"></script>
  <script src="js/app.js"></script>
  <script src="js/influenceweb.js"></script>
  <script src="js/usmap_paths.js"></script>
  <script src="js/member_bills.js"></script>
  <script src="js/congress.js"></script>
  <script src="js/glossary.js"></script>
  <script src="js/scoreinfo.js"></script>
  <script src="js/predictions.js"></script>
</body>
</html>
